<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — CarePulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page-center">
  <div style="width: 100%; max-width: 400px;">

    <div style="text-align: center; margin-bottom: 28px;">
      <h1 style="font-size: 24px;">Reset your password</h1>
      <p style="margin-top: 6px;">Choose a new password for your account</p>
    </div>

    <div class="card">
      <div id="alert-box"></div>

      <form id="reset-form">
        <div class="field">
          <label for="new-password">New password</label>
          <input type="password" id="new-password" placeholder="At least 6 characters" required minlength="6">
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" placeholder="Re-type your new password" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary" id="reset-btn">Reset password</button>
      </form>

      <p style="text-align: center; margin-top: 16px; font-size: 13px;">
        <a href="index.html">Back to log in</a>
      </p>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Pull the token out of the URL, e.g. reset-password.html?token=abc123
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');

  function showAlert(message, type = 'error') {
    document.getElementById('alert-box').innerHTML = `<div class="alert alert-${type}">${message}</div>`;
  }

  if (!token) {
    showAlert('This reset link is missing or invalid. Please request a new one from the login page.');
    document.getElementById('reset-form').style.display = 'none';
  }

  document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const newPassword = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;

    if (newPassword !== confirmPassword) {
      return showAlert("Passwords don't match.");
    }

    const btn = document.getElementById('reset-btn');
    btn.disabled = true;
    btn.textContent = 'Resetting...';

    try {
      await apiRequest('/auth/reset-password', {
        method: 'POST',
        body: { token, password: newPassword },
      });
      showAlert('Password reset! Redirecting you to log in...', 'success');
      setTimeout(() => { window.location.href = 'index.html'; }, 2000);
    } catch (err) {
      showAlert(err.message);
      btn.disabled = false;
      btn.textContent = 'Reset password';
    }
  });
</script>

</body>
</html>
